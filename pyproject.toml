[project]
name = "simplesat-mcp"
version = "0.1.0"
description = "MCP server for Simplesat (CSAT/NPS customer feedback survey platform)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
simplesat-mcp = "simplesat_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simplesat_mcp"]
